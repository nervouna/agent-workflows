<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作流进度</title>
  <link rel="stylesheet" href="/monitor.css">
  <script src="/monitor.js" defer></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">CODEx WORKFLOW</p><h1>工作流进度</h1></div><span id="connection" role="status">连接中…</span></header>
    <p id="summary" class="summary">正在读取进度…</p>
    <section aria-label="阶段进度"><div id="stages" class="stages"></div></section>
    <section aria-label="任务与报告"><h2>任务</h2><div id="tasks"></div></section>
    <section aria-label="修订记录"><h2>修订</h2><div id="revisions"></div></section>
    <footer><span id="activity">最近活动：暂无</span><span>页面仅显示进度；关闭页面不会停止任务。</span></footer>
  </main>
</body>
</html>
